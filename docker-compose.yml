version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hyncoat_db
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: hyncoat_pos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
